[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dfircmdcenter"
version = "0.1.0"
description = "Approval-gated local control plane for DFIR platform configuration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1,<0.29",
    "PyYAML>=6.0.2,<7",
]

[project.scripts]
dfirctl = "dfircmdcenter.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.18.2,<2",
    "pytest>=8.4.2,<10",
    "pytest-cov>=7.0.0,<8",
    "ruff>=0.13.2,<0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

